# Remove disabled property to start using the detection
disabled: true

name: gcp-service-account-change
displayName: service-account-change
description: Detects changes to service account permissions
file: gcp-service-account-change.sql
categories:
  - gcp
  - iam
  - identity-access-management
  - entity-management
  - signal
  - service-account
mitreAttacks:
  - execution
  - persistence
  - lateral-movement
mitreTechniques:
