title: GCP Workload Identity Change
status: test
description: |
  Detects creation or modification of a GCP Workload Identity Pool provider.
  Workload identity federation lets external identities impersonate a
  service account without a key, so unauthorized provider changes can
  enable persistent, credential-less access or privilege escalation.
author: RunReveal
date: 2025-01-22
logsource:
    product: gcp
sourcetypes:
    - gcp
    - gcplogs
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1098.001
    - attack.t1078.004
    - gcp
    - identity-access-management
    - signal
    - iam
    - identity-federation
mitreAttacks:
    - TA0003
    - TA0004
mitreTechniques:
    - T1098.001
    - T1078.004
detection:
    selection:
        eventName:
            - 'google.iam.v1.WorkloadIdentityPools.CreateWorkloadIdentityPoolProvider'
            - 'google.iam.v1.WorkloadIdentityPools.UpdateWorkloadIdentityPoolProvider'
    condition: selection
fields:
    - eventName
    - actor.email
    - srcIP
level: high
riskscore: 70