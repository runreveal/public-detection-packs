name: gcp-service-account-token-privilege-escalation
displayName: GCP Service Account Token Privilege Escalation
description: >
  Detects a human or interactive principal, not a service account,
  successfully minting a service account access token, signing a blob,
  signing a JWT, or using implicit delegation to impersonate a service
  account. Service accounts call these APIs on themselves constantly as
  routine workload-identity behavior, so this scopes to non-service-account
  callers, where impersonating a service account for one of these
  privileged actions is a far rarer and more meaningful signal of an
  attacker escalating from a compromised user credential to a service
  account's permissions.
file: gcp-service-account-token-privilege-escalation.sql
categories:
  - gcp
  - iam
  - identity-access-management
  - signal
  - privilege-escalation
mitreAttacks:
