title: Azure Entra Service Principal Credentials Added
status: test
description: >
  Detects when new credentials, a client secret or certificate, are
  added to an Entra service principal or application. An attacker who
  compromises an administrative account can add a rogue credential to an
  existing service principal to establish persistent, MFA-free access
  using application authentication instead of interactive user login.
author: RunReveal
logsource:
  product: azure
  service: aad
sourcetypes:
  - aad
tags:
  - azure
  - identity-access-management
  - signal
  - entra
  - persistence
  - aad
mitreAttacks:
  - TA0003
mitreTechniques:
  - T1098.001
detection:
  selection:
    eventName: Add service principal credentials
    rawLog.properties.result: success
  condition: selection
fields:
  - eventTime
  - eventID
  - actor.email
  - srcIP
  - rawLog.properties.targetResources
level: medium
riskscore: 60
