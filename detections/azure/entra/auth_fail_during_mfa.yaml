# Remove disabled property to start using the detection
disabled: true

name: entra-sign-in-fail-during-mfa
displayName: Entra Sign-In Fail During MFA
description: >
  This signal will fire when a user attempts to sign in to Azure Entra 
  and fails during the Multi Factor Authentication challenge.
file: auth_fail_during_mfa.sql
categories:
  - entra
  - aad
  - azure
  - runreveal
schedule: '*/15 * * * *'
severity: Low
riskScore: 15
sourceTypes:
  - aad
mitreAttacks:
  - initial-access
  - credential-access
