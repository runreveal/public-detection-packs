name: entra-auth-methods-policy-oidc-changed
displayName: Azure Entra Authentication Methods Policy OIDC URL Changed
description: >
  Detects a change to the OIDC discovery URL inside Entra ID's
  Authentication Methods Policy. This lets an attacker federate the
  tenant with an attacker-controlled identity provider, bypassing MFA
  and enabling unauthorized access through a bring-your-own IdP method.
file: auth_methods_policy_oidc_changed.sql
