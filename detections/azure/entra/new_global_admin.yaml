# Remove disabled property to start using the detection
disabled: true

name: entra-new-global-admin
displayName: New Global Admin User
description: >
  This detection will notify you when a user is added to the Global Admin role
  in Entra. Other roles can be added to the parameter to alert on.
file: new_global_admin.sql
categories:
  - azure
  - entra
  - identity-access-management
  - entity-management
  - signal
  - admin-privilege
schedule: '*/15 * * * *'
severity: High
riskScore: 90
parameters:
  roles: "['Global Administrator']"
sourceTypes:
  - aad
mitreAttacks:
  - initial-access
  - privilege-escalation
