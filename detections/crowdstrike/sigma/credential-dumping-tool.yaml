title: CrowdStrike Credential Dumping Tool Detected
id: crowdstrike-credential-dumping-tool
description: Detects execution of credential harvesting utilities such as Mimikatz, ProcDump, or other credential dumping tools on endpoints monitored by CrowdStrike
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1003/
tags:
  - attack.credential-access
  - attack.t1003
  - attack.t1003.001
  - crowdstrike
  - system-activity
  - signal
sourcetypes:
  - crowdstrike
  - crowdstrike-fdr
  - crowdstrike-data
mitreattacks:
  - credential-access
mitretechniques:
  - T1003
  - T1003.001
detection:
  selection_process:
    event_simpleName:
      - 'ProcessRollup2'
      - 'SyntheticProcessRollup2'
      - 'ProcessRollup2V2'
      - 'ProcessRollup2V3'
  selection_indicators:
    - CommandLine|contains:
        - 'mimikatz'
        - 'sekurlsa'
        - 'procdump'
        - 'lsass'
        - 'nanodump'
        - 'dumpert'
        - 'pypykatz'
        - 'kiwi'
    - ImageFileName|contains:
        - 'mimikatz'
        - 'procdump'
        - 'nanodump'
        - 'dumpert'
  condition: selection_process and selection_indicators
falsepositives:
  - Legitimate administrative tools that dump process memory
  - Security testing and authorized penetration testing
level: high
riskscore: 80
