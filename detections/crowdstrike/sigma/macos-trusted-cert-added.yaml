title: CrowdStrike macOS Trusted Certificate Added
id: crowdstrike-macos-trusted-cert-added
description: Detects certificate installation on macOS systems that may be used to establish trust for malicious applications or intercept encrypted traffic
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1553/
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.t1553
  - attack.t1553.004
  - crowdstrike
  - system-activity
  - signal
  - macos
  - certificate
sourcetypes:
  - crowdstrike
  - crowdstrike-fdr
  - crowdstrike-data
mitreAttacks:
  - TA0005
  - TA0003
mitreTechniques:
  - T1553
  - T1553.004
detection:
  selection:
    event_simpleName:
      - 'ProcessRollup2'
      - 'SyntheticProcessRollup2'
    event_platform: 'Mac'
    CommandLine|contains:
      - 'security add-trusted-cert'
      - 'security import'
      - '/Library/Keychains/System.keychain'
  condition: selection
falsepositives:
  - Legitimate enterprise certificate management
  - Software installation requiring trusted certificates
level: medium
riskscore: 60
