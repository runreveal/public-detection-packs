name: google-workspace-mobile-device-compromised
displayName: Google Workspace Mobile Device Compromised
description:
  Detects when a mobile device is marked as compromised in Google Workspace.
  This event indicates that Google has detected suspicious or malicious activity on
  a mobile device that accesses organizational resources. A compromised device poses
  significant security risks including data theft, unauthorized access, and potential
  lateral movement within the organization.
