  - gsuite
  - calendar
  - acl
  - public-access
  - data-exposure
  - privacy
mitreAttacks:
  - collection
  - exfiltration
  - defense-evasion
severity: High
riskScore: 75
schedule: '*/15 * * * *'
parameters:
  window: '30'
sourceTypes:
