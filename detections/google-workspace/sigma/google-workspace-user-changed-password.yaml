disabled: true
autoTriage: true
title: Google Workspace User Changed Password
status: test
description: |
  Detects when an administrator changes a user's password in Google
  Workspace. This may indicate unauthorized credential manipulation
  or account takeover by a compromised admin.
author: RunReveal
sourcetypes:
    - google-workspace
    - gsuite
tags:
    - tier-one
    - attack.credential-access
    - attack.persistence
    - google-workspace
    - gsuite
    - identity-access-management
    - signal
    - authentication
    - credential-management
mitreAttacks:
    - TA0006
    - TA0003
detection:
    selection:
        id.applicationName: 'admin'
        eventName: 'CHANGE_PASSWORD'
    condition: selection
fields:
    - eventName
    - id.applicationName
    - actor.email
    - srcIP
level: medium
riskscore: 50