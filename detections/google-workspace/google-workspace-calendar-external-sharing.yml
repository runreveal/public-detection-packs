name: google-workspace-calendar-external-sharing
displayName: Google Workspace Calendar External Sharing Enabled
description:
  Detects when calendar sharing outside the domain is enabled in Google
  Workspace with permissive access levels (read-write, read-only, or manage access).
  This could allow external users to access internal calendar information and represents
  a potential data exposure risk.
