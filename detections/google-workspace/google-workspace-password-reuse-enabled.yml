name: google-workspace-password-reuse-enabled
displayName: Google Workspace Password Reuse Enabled
description:
  Detects when password reuse is enabled in Google Workspace. This security
  setting allows users to reuse previous passwords, which significantly weakens password
  security and increases the risk of credential-based attacks. Enabling password reuse
  undermines password rotation policies and makes accounts more vulnerable to compromise.
