name: google-workspace-trusted-domains-modified
displayName: Google Workspace Trusted Domains Modified
description:
  Detects when trusted domains are modified in Google Workspace domain
  settings. This includes adding, removing, or changing trusted domains which can
  affect cross-domain authentication, data sharing, and security policies. Changes
  to trusted domains should be monitored as they can impact organizational security
  boundaries.
