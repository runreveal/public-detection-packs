name: google-workspace-service-account-added-to-group
displayName: Google Workspace Service Account Added to Group
description: Detects when a Google service account (ending in gserviceaccount.com) is added to a Google Workspace group, excluding groups that start with 'sa-' which are typically service account groups. This could indicate privilege escalation or unauthorized access attempts using service accounts.
