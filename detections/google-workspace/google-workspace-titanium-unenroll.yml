displayName: Google Workspace Titanium Unenroll
description:
  Detects when a user unenrolls from Google's Titanium security program
  or advanced protection features. Titanium unenrollment can indicate a potential
  security risk as it removes enhanced protection mechanisms. This event should be
  monitored to ensure legitimate security changes and detect potential account compromise
  or policy violations.
