title: Auth0 Unauthorized Admin Action Attempt
id: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
description: Detects when a user attempts administrative actions they are not authorized to perform, indicating potential privilege escalation or unauthorized access attempts.
references:
  - https://auth0.com/docs/manage-users/access-control
author: RunReveal
date: 2025-01-27
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - auth0
  - identity-access-management
  - signal
  - privilege-escalation
  - unauthorized-access
sourcetypes:
  - auth0
detection:
  selection_type:
    type:
      - fapi
      - fn
      - flo
  selection_permission:
    description|contains: 'permission'
  condition: selection_type and selection_permission
falsepositives:
  - Users accidentally attempting actions outside their permissions
  - Application misconfigurations
level: high
riskscore: 75
mitreattacks:
  - TA0004
  - TA0005
mitretechniques:
  - T1078
  - T1548
