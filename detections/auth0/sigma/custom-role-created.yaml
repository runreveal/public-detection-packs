disabled: true
title: Auth0 Custom Role Created
id: 5d6e7f8a-9b0c-1d2e-3f4a-5b6c7d8e9f0a
description: Detects when a custom role with potentially elevated privileges is created in Auth0, which should be reviewed for authorization and security implications.
references:
  - https://auth0.com/docs/manage-users/access-control/configure-core-rbac/roles
author: RunReveal
date: 2025-01-27
tags:
  - attack.persistence
  - attack.privilege-escalation
  - auth0
  - identity-access-management
  - signal
  - privilege-escalation
  - role-management
sourcetypes:
  - auth0
detection:
  selection_type:
    type: sapi
  selection_description_create:
    description|contains: 'Create a role'
  selection_description_created:
    description|contains:
      - 'role'
      - 'created'
  selection_api_method:
    rawLog|contains|all:
      - 'create:roles'
      - 'POST'
  selection_api_endpoint:
    rawLog|contains|all:
      - '/api/v2/roles'
      - 'POST'
  condition: selection_type and (selection_description_create or selection_description_created or selection_api_method or selection_api_endpoint)
falsepositives:
  - Legitimate role creation by administrators
  - Automated role provisioning systems
level: medium
riskscore: 65
mitreAttacks:
  - TA0003
  - TA0004
mitreTechniques:
  - T1098
  - T1078
