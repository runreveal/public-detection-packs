name: github-actions-workflow-modified
displayName: GitHub Actions Workflow Modified
description:
  Detects creation, modification, or deletion of GitHub Actions workflows
  which can be used to execute malicious code in CI/CD pipelines. GitHub Actions
  workflows provide powerful automation capabilities but can also be exploited for
  supply chain attacks, credential theft, or unauthorized code execution. Workflow
  modifications should be carefully monitored to ensure they align with security
  policies and development practices. Unauthorized workflow changes could enable
  persistent code execution, exfiltrate secrets, or compromise the software supply
  chain.
