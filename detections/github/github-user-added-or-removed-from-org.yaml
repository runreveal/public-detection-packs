name: github-user-added-or-removed-from-org
displayName: GitHub User Added or Removed from Org
description: >-
  Detects when users are added to or removed from GitHub organizations. Organization
  membership changes can significantly impact access to repositories, teams, and
  organizational resources. Unauthorized membership modifications could indicate
  account compromise, insider threats, or administrative errors that could lead
  to unauthorized access or loss of legitimate access.
