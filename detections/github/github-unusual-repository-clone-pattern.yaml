name: github-unusual-repository-clone-pattern
displayName: GitHub Unusual Repository Clone Pattern
description:
  Detects mass cloning of repositories or cloning patterns that may indicate
  data exfiltration attempts. Large-scale repository cloning, especially of private
  or sensitive repositories, can indicate insider threats, compromised accounts,
  or data theft operations. This detection monitors for bulk cloning activities,
  clones from unusual geographic locations, or cloning of multiple private repositories
  in a short time period. Such patterns often precede data exfiltration or intellectual
  property theft.
