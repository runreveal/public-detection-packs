  - security
  - system-activity
  - configuration-audit
  - signal
  - advanced-security
  - vulnerability-management
  - policy-management
mitreAttacks:
  - defense-evasion
  - persistence
  - impact
severity: Critical
riskScore: 95
schedule: '*/15 * * * *' 