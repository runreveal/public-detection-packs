displayName: GitHub User Access Key Created
description:
  Detects creation of new SSH public keys for GitHub user accounts. SSH
  key creation can indicate legitimate setup of development environments but may also
  represent unauthorized access attempts, account compromise, or persistence mechanisms.
  New SSH keys should be monitored to ensure they are authorized and properly managed
  according to security policies.
