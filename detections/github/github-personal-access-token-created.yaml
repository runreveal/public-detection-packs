disabled: true
name: github-personal-access-token-created
displayName: GitHub Personal Access Token Created
description:
  Detects creation of personal access tokens (PATs) with elevated scopes
  in GitHub. Personal access tokens provide programmatic access to GitHub resources
  and can be used for legitimate automation but also pose significant security risks
  if compromised or misused. Tokens with broad scopes (repo, admin, delete_repo)
  grant extensive privileges and should be carefully monitored. Unauthorized token
  creation may indicate account compromise, persistence establishment, or preparation
  for lateral movement and data exfiltration.
