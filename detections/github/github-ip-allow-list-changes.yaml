name: github-ip-allow-list-changes
displayName: GitHub IP Allow List Changes
description: >-
  Detects changes to GitHub organization IP allow list settings including enabling/disabling
  the allow list, modifying entries, and changes to installed app restrictions. IP allow list
  modifications can impact organization security posture and should be monitored for unauthorized
  changes that could bypass network security controls or enable unauthorized access.
