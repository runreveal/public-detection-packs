name: github-package-published
displayName: GitHub Package Published
description:
  Detects when packages are published to GitHub Packages registry (npm,
  Maven, NuGet, Docker, RubyGems, etc.). Package publishing can be legitimate software
  distribution but also represents a critical supply chain attack vector. Attackers
  may publish malicious packages with typosquatted names, backdoored dependencies,
  or malware payloads to compromise downstream consumers. This detection monitors
  package publishing activities to identify suspicious patterns including first-time
  publishers, rapid publishing activity, packages with names similar to popular
  libraries, or publishing from recently created accounts.
