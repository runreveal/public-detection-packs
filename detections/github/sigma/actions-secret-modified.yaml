title: GitHub Actions Secret Modified
id: github-actions-secret-modified
status: stable
description: Detects when a GitHub Actions secret is modified at the repository or organization level. Secret modifications should be monitored as unauthorized changes could indicate credential tampering or an attempt to inject malicious values into CI/CD pipelines.
author: RunReveal
date: 2025/01/30
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
  - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
tags:
  - attack.credential-access
  - attack.persistence
  - attack.t1552
  - github
  - application-activity
  - signal
  - secrets
  - cicd
sourcetypes:
  - github
mitreAttacks:
  - TA0006
  - TA0003
mitreTechniques:
  - T1552
detection:
  selection:
    action:
      - 'repo.update_actions_secret'
      - 'org.update_actions_secret'
      - 'environment.update_actions_secret'
  condition: selection
falsepositives:
  - Legitimate secret rotation by administrators
  - Automated credential rotation policies
  - CI/CD configuration updates
level: medium
riskscore: 55
fields:
  - action
  - org
  - repo
  - key
  - actor
  - actor_is_bot
  - environment_name
  - operation_type
