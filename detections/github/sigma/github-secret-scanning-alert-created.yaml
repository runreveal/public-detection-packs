disabled: true
title: GitHub Secret Scanning Alert Created
status: test
description: |
  Detects when a secret scanning alert is created in a GitHub repository,
  indicating a potential leaked secret or credential.
author: RunReveal
logsource:
    product: github
sourcetypes:
    - github-webhook
detection:
    selection:
        action: 'secret_scanning_alert.create'
    condition: selection
fields:
    - action
    - actor.email
    - actor.username
level: high
riskscore: 80
tags:
    - attack.credential-access
    - github
    - findings
    - signal
    - secret-management
    - vulnerability-management
mitreAttacks:
    - TA0006