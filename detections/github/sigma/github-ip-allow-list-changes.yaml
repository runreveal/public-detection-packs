disabled: true
title: GitHub IP Allow List Changes
status: test
description: |
  Detects changes to GitHub organization IP allow list settings including
  enabling, disabling, and modifying allow list entries.
author: RunReveal
logsource:
    product: github
sourcetypes:
    - github-webhook
detection:
    selection:
        action:
            - 'ip_allow_list.enable'
            - 'ip_allow_list.disable'
            - 'ip_allow_list.enable_for_installed_apps'
            - 'ip_allow_list.disable_for_installed_apps'
            - 'ip_allow_list_entry.create'
            - 'ip_allow_list_entry.update'
            - 'ip_allow_list_entry.destroy'
    condition: selection
fields:
    - action
    - actor.email
    - actor.username
level: high
riskscore: 70
tags:
    - attack.defense-evasion
    - attack.persistence
    - github
    - network-activity
    - signal
    - network-security
    - access-control
mitreAttacks:
    - TA0005
    - TA0003