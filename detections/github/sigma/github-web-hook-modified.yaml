disabled: true
title: GitHub Web Hook Modified
status: test
description: |
  Detects modifications to GitHub webhooks, excluding changes made by
  known bot accounts.
author: RunReveal
logsource:
    product: github
sourcetypes:
    - github-webhook
detection:
    selection:
        action|startswith: 'hook.'
    filter_bot:
        actor.email: 'sync-by-unito[bot]'
    condition: selection and not filter_bot
fields:
    - action
    - actor.email
    - actor.username
level: medium
riskscore: 60
tags:
    - attack.persistence
    - attack.exfiltration
    - github
    - application-activity
    - signal
    - webhook
    - integration
mitreAttacks:
    - TA0003
    - TA0010