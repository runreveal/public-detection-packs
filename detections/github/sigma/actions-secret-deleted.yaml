disabled: true
title: GitHub Actions Secret Deleted
id: github-actions-secret-deleted
status: stable
description: Detects when a GitHub Actions secret is deleted at the repository, organization, or environment level. Secret deletion could indicate cleanup activities but may also represent an attempt to disrupt CI/CD pipelines or remove evidence of unauthorized access.
author: RunReveal
date: 2025/01/30
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
  - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
tags:
  - attack.impact
  - attack.defense-evasion
  - attack.t1485
  - attack.t1070
  - github
  - application-activity
  - signal
  - secrets
  - cicd
sourcetypes:
  - github
mitreAttacks:
  - TA0040
  - TA0005
mitreTechniques:
  - T1485
  - T1070
detection:
  selection:
    action:
      - 'repo.remove_actions_secret'
      - 'org.remove_actions_secret'
      - 'environment.remove_actions_secret'
  condition: selection
falsepositives:
  - Legitimate secret cleanup by administrators
  - Repository or project decommissioning
  - Secret rotation where old secrets are removed
level: medium
riskscore: 60
fields:
  - action
  - org
  - repo
  - key
  - actor
  - actor_is_bot
  - environment_name
  - operation_type
