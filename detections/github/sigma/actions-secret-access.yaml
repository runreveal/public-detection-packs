title: GitHub Actions Secret Access
id: github-actions-secret-access
description: Detects GitHub Actions workflows accessing secrets which may indicate credential exposure or unauthorized secret usage
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1552/
tags:
  - attack.credential-access
  - attack.t1552
  - github
  - application-activity
  - signal
  - secrets
  - cicd
sourcetypes:
  - github
mitreattacks:
  - credential-access
mitretechniques:
  - T1552
detection:
  selection:
    action:
      - 'workflows.completed_workflow_run'
      - 'workflows.started_workflow_run'
    secrets_passed: '*'
  filter:
    secrets_passed: ''
  condition: selection and not filter
falsepositives:
  - Legitimate workflow executions requiring secrets
  - CI/CD pipelines
  - Deployment automations
level: medium
riskscore: 55
