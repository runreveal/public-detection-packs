disabled: true
title: GitHub Actions Secret Created
id: github-actions-secret-created
status: stable
description: Detects when a GitHub Actions secret is created at the repository, organization, or environment level. Secret creation should be monitored to ensure credentials and sensitive configuration values are being managed appropriately and by authorized personnel.
author: RunReveal
date: 2025/01/30
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
  - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
tags:
  - attack.credential-access
  - attack.persistence
  - attack.t1552
  - github
  - application-activity
  - signal
  - secrets
  - cicd
sourcetypes:
  - github
mitreAttacks:
  - TA0006
  - TA0003
mitreTechniques:
  - T1552
detection:
  selection:
    action:
      - 'repo.create_actions_secret'
      - 'org.create_actions_secret'
      - 'environment.create_actions_secret'
  condition: selection
falsepositives:
  - Legitimate secret creation by administrators
  - CI/CD pipeline setup and configuration
  - Automated secret rotation processes
level: medium
riskscore: 55
fields:
  - action
  - org
  - repo
  - key
  - actor
  - actor_is_bot
  - environment_name
  - operation_type
