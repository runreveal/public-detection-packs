name: github-api-high-volume-repository-enumeration
displayName: GitHub API High Volume Repository Enumeration
description:
  Detects unusual patterns of repository enumeration via GitHub API calls,
  indicating potential reconnaissance activities. High volumes of repository listing,
  search, or access operations from a single user or IP address may indicate automated
  scanning, reconnaissance before targeted attacks, or data gathering for competitive
  intelligence. This detection helps identify early-stage attack reconnaissance and
  unauthorized automation that could precede more serious security incidents.
file: github-api-high-volume-repository-enumeration.sql
