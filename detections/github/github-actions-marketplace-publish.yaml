disabled: true
name: github-actions-marketplace-publish
displayName: GitHub Actions Marketplace Publish
description:
  Detects when custom GitHub Actions are published to the GitHub Actions
  Marketplace or when action definitions are created/modified in repositories. GitHub
  Actions provide reusable automation components that can be shared across organizations
  and projects, but malicious actions can be used to steal secrets, execute arbitrary
  code, or establish persistence in CI/CD pipelines. Attackers may publish backdoored
  actions, actions that exfiltrate environment variables and secrets, or actions
  that inject malicious code into build processes. This detection monitors action
  publication and modification events to identify potential supply chain attacks
  targeting the GitHub Actions ecosystem.
