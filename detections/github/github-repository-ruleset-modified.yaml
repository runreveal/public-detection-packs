name: github-repository-ruleset-modified
displayName: GitHub Repository Ruleset Modified
description: >-
  Detects modifications to GitHub repository rulesets including creation, updates,
  and deletion of rules that govern repository behavior and security policies.
  Repository rulesets enforce critical security controls such as branch protection,
  required status checks, and merge restrictions. Unauthorized ruleset modifications
  could weaken security posture, bypass code review requirements, or enable
  unauthorized code deployment.
file: github-repository-ruleset-modified.sql
categories:
  - runreveal-detection
  - github
  - security-configuration
  - policy-management
mitreAttacks:
  - defense-evasion
  - persistence
  - privilege-escalation
severity: High
riskScore: 80
schedule: '*/15 * * * *' 