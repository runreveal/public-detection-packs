name: github-repository-collaborator-change
displayName: GitHub Repository Collaborator Change
description:
  Detects additions or removals of collaborators from private GitHub repositories,
  excluding automated service accounts. Collaborator changes can significantly impact
  repository security and access controls. Unauthorized collaborator modifications
  could lead to data exposure, unauthorized code access, or privilege escalation within
  private repositories.
