name: github-user-role-updated
displayName: GitHub User Role Updated
description:
  Detects when user roles are updated within GitHub organizations, including
  privilege escalations and role modifications. Role updates can significantly impact
  user permissions and access to organizational resources. Unauthorized role changes
  could indicate privilege escalation attempts, account compromise, or administrative
  errors that could lead to unauthorized access or loss of appropriate access controls.
