title: HashiCorp Vault Secret Engine Enabled
id: hashicorp-vault-secret-engine-enabled
description: >
  Detects when a new secret engine is mounted in HashiCorp Vault. Adding secret engines
  can expand the attack surface or be used to establish persistence by creating new
  storage locations for sensitive data.
references:
  - https://developer.hashicorp.com/vault/docs/commands/secrets/enable
  - https://developer.hashicorp.com/vault/api-docs/system/mounts
author: RunReveal
date: 2025-07-24
tags:
  - hashicorp-vault
  - audit-activity
  - signal
sourcetypes:
  - hashicorp-vault
detection:
  selection:
    request.path|startswith: sys/mounts/
    request.operation: create
  condition: selection
falsepositives:
  - Planned provisioning of new secret engines during infrastructure expansion
  - Infrastructure as code deployments managing Vault configuration
level: medium
riskscore: 55
mitreAttacks:
  - TA0003
mitreTechniques:
  - T1078
