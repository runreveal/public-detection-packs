title: Duo Security Admin User Created or Modified
id: duo-security-admin-user-created-or-modified
description: >
  Detects creation or modification of an administrator account in the Duo
  Admin Panel. Unauthorized admin account changes could indicate an attacker
  establishing persistence or escalating privileges.
references:
  - https://duo.com/docs/adminapi#administrator-logs
  - https://duo.com/docs/administration-admins
author: RunReveal
date: 2025-07-24
tags:
  - duo
  - identity-access-management
  - signal
sourcetypes:
  - duo
detection:
  selection:
    eventName:
      - admin_create
      - admin_update
  condition: selection
falsepositives:
  - Routine admin account provisioning by authorized IT staff
  - Scheduled role changes for administrators
level: high
riskscore: 75
mitreAttacks:
  - TA0003
mitreTechniques:
  - T1098
