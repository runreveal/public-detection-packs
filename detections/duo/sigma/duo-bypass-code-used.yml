title: Duo Security Bypass Code Used
id: duo-security-bypass-code-used
description: >
  Detects authentication using a bypass code instead of a standard MFA factor.
  Bypass codes are intended for emergency access when a user cannot use their
  enrolled device, and their use may indicate credential compromise or
  unauthorized access.
references:
  - https://duo.com/docs/adminapi#authentication-logs
  - https://duo.com/docs/administration-users#bypass-codes
author: RunReveal
date: 2025-07-24
tags:
  - duo
  - identity-access-management
  - signal
sourcetypes:
  - duo
detection:
  selection:
    duoFactor: bypass_code
  condition: selection
falsepositives:
  - Legitimate use of a bypass code when a user has lost access to their MFA device
  - IT helpdesk issuing bypass codes for locked-out users
level: high
riskscore: 75
mitreAttacks:
  - TA0001
mitreTechniques:
  - T1078
