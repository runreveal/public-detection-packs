title: Duo Security Integration Secret Key Viewed
id: duo-security-integration-secret-key-viewed
description: >
  Detects when an administrator views the secret key for a Duo integration.
  Exposure of integration secret keys could allow an attacker to impersonate
  an application or intercept authentication requests.
references:
  - https://duo.com/docs/adminapi#administrator-logs
  - https://duo.com/docs/administration-applications
author: RunReveal
date: 2025-07-24
tags:
  - duo
  - audit-activity
  - signal
sourcetypes:
  - duo
detection:
  selection:
    eventName: integration_skey_view
  condition: selection
falsepositives:
  - Administrators retrieving secret keys during legitimate application setup
  - Routine integration configuration or rotation
level: medium
riskscore: 60
mitreAttacks:
  - TA0006
mitreTechniques:
  - T1552
