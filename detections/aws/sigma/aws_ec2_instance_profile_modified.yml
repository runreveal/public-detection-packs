title: AWS EC2 Instance Profile Modified
id: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
description:
  Detects when an EC2 instance profile is associated, replaced, or disassociated
  from an EC2 instance. Changes to instance profiles can grant or revoke permissions
  to EC2 instances and may indicate privilege escalation or persistence attempts.
references:
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AssociateIamInstanceProfile.html
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ReplaceIamInstanceProfileAssociation.html
author: RunReveal
date: 2025-10-21
tags:
  - aws
  - ec2
  - cloudtrail
  - identity-access-management
  - system-activity
  - signal
  - instance-profile
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: ec2.amazonaws.com
    eventName:
      - AssociateIamInstanceProfile
      - ReplaceIamInstanceProfileAssociation
      - DisassociateIamInstanceProfile
  condition: selection
falsepositives:
  - Legitimate instance profile updates during infrastructure deployments
  - Automated configuration management tools
  - Security remediation activities
level: medium
riskscore: 65
mitreattacks:
  - TA0004
  - TA0003
mitretechniques:
  - T1098
