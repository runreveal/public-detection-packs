title: AWS IAM Policy Created with Admin Privileges
id: 5f4c71d2-8025-48c9-a98e-f5f9d7b24701
description:
  Detects the creation of IAM policies that grant administrator privileges,
  which could indicate privilege escalation attempts.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_create.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html
author: Claude
date: 2024-06-20
tags:
  - cloudtrail
  - iam
  - admin-policy
  - privilege-escalation
  - attack.privilege_escalation
  - attack.persistence
  - attack.t1098
  - aws
  - identity-access-management
  - signal
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName:
      - CreatePolicy
      - CreatePolicyVersion
      - PutUserPolicy
      - PutRolePolicy
      - PutGroupPolicy
      - AttachUserPolicy
      - AttachRolePolicy
      - AttachGroupPolicy
  filter_hcp_terraform:
    userIdentity.sessionContext.sessionIssuer.userName: hcp-terraform
  filter_admin_wildcard:
    requestParameters|contains:
      - '"Action":"*"'
      - '"Resource":"*"'
  filter_iam_wildcard:
    requestParameters|contains: '"iam:*"'
  filter_passrole_wildcard:
    requestParameters|contains: iam:PassRole
  condition:
    selection and not filter_hcp_terraform and (all of filter_admin_wildcard
    or filter_iam_wildcard or filter_passrole_wildcard)
falsepositives:
  - Legitimate creation of administrative policies by authorized administrators
  - HCP Terraform service activities
level: high
riskscore: 75
mitreattacks:
  - privilege-escalation
  - persistence
mitretechniques:
  - T1098
