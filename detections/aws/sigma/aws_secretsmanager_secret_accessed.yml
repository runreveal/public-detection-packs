title: AWS Secrets Manager Secret Accessed
id: 9e0f1a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4b
description:
  Detects when a secret value is retrieved from AWS Secrets Manager. While this
  is often legitimate application behavior, monitoring secret access can help
  identify unauthorized access, credential theft, or compromised applications.
references:
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/monitoring.html
  - https://attack.mitre.org/techniques/T1555/
author: Claude
date: 2025-10-21
tags:
  - aws
  - secrets-manager
  - cloudtrail
  - identity-access-management
  - system-activity
  - signal
  - secret-access
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: GetSecretValue
  condition: selection
falsepositives:
  - Normal application operations retrieving secrets
  - Automated deployment processes
  - Infrastructure as Code (IaC) operations
  - Lambda functions and ECS tasks accessing secrets
level: low
riskscore: 40
mitreattacks:
  - credential-access
mitretechniques:
  - T1555
