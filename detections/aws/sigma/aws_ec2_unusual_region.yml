title: AWS EC2 Instance Started in Unusual Region
id: o9p0q1r2-s3t4-u5v6-w7x8-y9z0a1b2c3d4
description:
  Detects when EC2 instances are launched in unusual or unused AWS regions,
  which could indicate cryptomining or data exfiltration.
