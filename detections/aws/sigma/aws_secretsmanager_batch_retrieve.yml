title: AWS Secrets Manager Batch Secret Retrieval
id: e5f6a7b8-c9d0-4e1f-a02b-3c4d5e6f7a8b
description: >
  Detects use of BatchGetSecretValue, which retrieves multiple secrets in
  a single API call. Attackers with Secrets Manager read access use this
  to exfiltrate many credentials quickly, compared to the single-secret
  GetSecretValue call already covered elsewhere.
references:
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html
author: RunReveal
date: 2025-01-22
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1555
  - aws
  - secretsmanager
  - identity-access-management
  - signal
  - credential-access
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: BatchGetSecretValue
  filter_error:
    errorCode|re: '.+'
  condition: selection and not filter_error
falsepositives:
  - Automation or deployment tooling that retrieves multiple secrets at once
level: medium
riskscore: 55
mitreAttacks:
  - TA0006
  - TA0009
mitreTechniques:
  - T1555
