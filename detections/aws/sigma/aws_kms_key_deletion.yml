title: AWS KMS Key Scheduled for Deletion
id: a9b8c7d6-e5f4-3g2h-1i0j-k9l8m7n6o5p4
description:
  Detects when a KMS key is scheduled for deletion or disabled, which could
  impact data availability or indicate malicious activity.
references:
  - https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
  - https://docs.aws.amazon.com/kms/latest/APIReference/API_ScheduleKeyDeletion.html
author: Claude
date: 2024-06-20
tags:
  - attack.impact
  - attack.t1485
  - aws
  - cloudtrail
  - system-activity
  - resource-activity
  - signal
  - kms
  - key-deletion
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: kms.amazonaws.com
    eventName:
      - ScheduleKeyDeletion
      - DisableKey
      - DeleteAlias
  condition: selection
falsepositives:
  - Legitimate key rotation or cleanup activities
  - Decommissioning of services that used KMS keys
level: medium
riskscore: 70
mitreattacks:
  - impact
mitretechniques:
  - T1485
