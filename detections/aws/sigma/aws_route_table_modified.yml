title: AWS Route Table Modified
id: u5v6w7x8-y9z0-a1b2-c3d4-e5f6g7h8i9j0
description:
  Detects modifications to AWS VPC route tables, which could indicate network
  traffic redirection or man-in-the-middle attempts.
references:
  - https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ReplaceRoute.html
author: Claude
date: 2024-06-20
tags:
  - attack.exfiltration
  - attack.t1048
  - aws
  - cloudtrail
  - network-activity
  - network-configuration
  - signal
  - route-table
  - network-tampering
  - attack.defense_evasion
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: ec2.amazonaws.com
    eventName:
      - CreateRoute
      - DeleteRoute
      - ReplaceRoute
      - CreateRouteTable
      - DeleteRouteTable
      - AssociateRouteTable
      - DisassociateRouteTable
  condition: selection
falsepositives:
  - Legitimate network configuration changes
  - Infrastructure as code deployments
  - Network automation
level: medium
riskscore: 55
mitreattacks:
  - exfiltration
mitretechniques:
  - T1048
