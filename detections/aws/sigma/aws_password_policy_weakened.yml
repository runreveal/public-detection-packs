title: AWS Password Policy Weakened
id: 9c6e2d8f-4a7b-5c3e-8b1d-7e9a0c3d2e1f
description:
  Detects changes to the AWS account password policy that weaken security
  requirements, potentially making brute force attacks easier.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAccountPasswordPolicy.html
author: Claude
date: 2024-06-20
tags:
  - aws
  - cloudtrail
  - identity-access-management
  - entity-management
  - signal
  - password-policy
  - policy-weakening
  - attack.defense_evasion
  - attack.credential_access
  - attack.t1556
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: UpdateAccountPasswordPolicy
  weaken_policy:
    requestParameters|re:
      - .*"minimumPasswordLength":\s*[678].*
      - .*"requireSymbols":\s*false.*
      - .*"requireNumbers":\s*false.*
      - .*"requireUppercaseCharacters":\s*false.*
      - .*"requireLowercaseCharacters":\s*false.*
      - .*"passwordReusePrevention":\s*[0-3].*
      - .*"maxPasswordAge":\s*(180|365).*
      - .*"allowUsersToChangePassword":\s*false.*
  condition: selection and weaken_policy
falsepositives:
  - Legitimate password policy updates that may appear to weaken requirements but are
    part of a comprehensive security strategy
level: medium
riskscore: 70
mitreattacks:
  - persistence
  - defense-evasion
  - credential-access
mitretechniques:
  - T1556
