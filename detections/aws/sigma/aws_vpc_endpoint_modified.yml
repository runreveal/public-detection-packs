title: AWS VPC Endpoint Modified
id: v7w8x9y0-z1a2-b3c4-d5e6-f7g8h9i0j1k2
description: Detects modifications to VPC endpoints, which could be used to redirect traffic or establish covert channels.
references:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyVpcEndpoint.html
author: Claude
date: 2024-06-20
tags:
    - attack.defense_evasion
    - attack.persistence
    - attack.t1205
sourcetypes:
    - cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName:
            - CreateVpcEndpoint
            - ModifyVpcEndpoint
            - DeleteVpcEndpoints
            - ModifyVpcEndpointServiceConfiguration
            - ModifyVpcEndpointServicePermissions
    condition: selection
falsepositives:
    - Legitimate VPC endpoint configuration changes
    - Infrastructure as code deployments
    - Application architecture changes
level: medium
riskscore: 55
mitreattacks:
    - defense-evasion
    - persistence