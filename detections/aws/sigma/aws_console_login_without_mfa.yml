disabled: true
title: AWS Console Login Without MFA
id: f1e2d3c4-b5a6-4890-fedc-ba0987654321
description: >
  Detects successful AWS console logins by IAM users where MFA was not used.
  Scoped to IAMUser identity type only — federated and AWS Identity Center
  sessions always report MFAUsed as No in CloudTrail regardless of actual MFA
  status, making reliable MFA detection impossible for those session types via
  this event.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/cloudtrail-integration.html
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
author: RunReveal
date: 2026-05-13
tags:
  - aws
  - cloudtrail
  - identity-access-management
  - signal
  - mfa
  - authentication
sourcetypes:
  - cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    responseElements.ConsoleLogin: Success
    userIdentity.type: IAMUser
  no_mfa:
    additionalEventData.MFAUsed: "No"
  condition: selection and no_mfa
falsepositives:
  - Break-glass or legacy IAM accounts that intentionally operate without MFA
  - Service accounts with console access in older environments
level: medium
riskscore: 65
mitreAttacks:
  - TA0001
  - TA0003
  - TA0004
  - TA0005
  - TA0006
mitreTechniques:
  - T1078
