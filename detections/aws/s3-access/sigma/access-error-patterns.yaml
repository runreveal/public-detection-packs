title: S3 Access Error Patterns
id: aws-s3-access-error-patterns
description: Detects error patterns indicating reconnaissance, permission testing, or brute force attempts
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1526/
tags:
  - attack.discovery
  - attack.t1526
  - aws
  - s3
  - network-activity
  - signal
  - reconnaissance
sourcetypes:
  - s3-access
mitreAttacks:
  - TA0007
mitreTechniques:
