disabled: true
autoTriage: true
title: Critical Policy Changes
status: test
description: |
  Detects critical IAM and resource policy changes including policy creation, security
  group ingress rules, KMS key policies, S3 bucket policies, IAM role trust policies,
  and user/group/role policy attachments. These changes may indicate privilege escalation
  or defense evasion.
author: RunReveal
logsource:
    product: aws
    service: cloudtrail
sourcetypes:
    - cloudtrail
tags:
    - tier-one
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.persistence
    - attack.t1098
    - aws
    - cloudtrail
    - identity-access-management
    - signal
    - iam
    - policy-change
mitreAttacks:
    - TA0003
    - TA0004
    - TA0005
mitreTechniques:
    - T1098
detection:
    selection:
        eventName:
            - 'CreatePolicy'
            - 'CreatePolicyVersion'
            - 'PutUserPolicy'
            - 'PutRolePolicy'
            - 'PutGroupPolicy'
            - 'AttachUserPolicy'
            - 'AttachRolePolicy'
            - 'AttachGroupPolicy'
            - 'AuthorizeSecurityGroupIngress'
            - 'PutKeyPolicy'
            - 'PutBucketPolicy'
            - 'UpdateAssumeRolePolicy'
    condition: selection
fields:
    - eventName
    - eventSource
    - userIdentity.arn
    - requestParameters
    - actor.email
level: high
riskscore: 70