disabled: true
title: AWS GuardDuty Low Severity Findings
id: aws-guardduty-low-severity-findings
description: Tracks low-priority security observations from AWS GuardDuty for monitoring and baseline establishment
author: RunReveal
date: 2025/01/22
references:
  - https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html
tags:
  - attack.discovery
  - attack.reconnaissance
  - aws
  - guardduty
  - findings
  - non-signal
logsource:
  product: aws
  service: guardduty
mitreAttacks:
  - TA0007
mitreTechniques:
  - T1526
sourcetypes:
  - guardduty
detection:
  selection:
    severity|re: '^[123](\.\d+)?$'
  condition: selection
falsepositives:
  - Legitimate activities
  - Normal operations may trigger low findings
level: low
riskscore: 30
