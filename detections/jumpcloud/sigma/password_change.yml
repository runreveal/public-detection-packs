title: JumpCloud User/Admin Password Changed
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
description: Detects when a user or admin password is changed in JumpCloud
author: RunReveal
date: 2025-05-26
references:
    - https://docs.jumpcloud.com/api/insights/directory/1.0/index.html
tags:
    - attack.credential-access
    - attack.t1078 # Valid Accounts
sourcetypes:
    - jumpcloud
categories:
    - jumpcloud
    - jumpcloud
    - identity-access-management
    - authentication
    - signal
    - password-change
mitreattacks:
    - credential-access
detection:
    selection:
        normalized.eventName:
            - user_password_set
            - admin_password_change
    condition: selection
falsepositives:
    - Legitimate password changes by users or administrators
level: medium
riskscore: 30
