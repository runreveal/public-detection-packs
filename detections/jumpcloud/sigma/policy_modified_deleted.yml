title: JumpCloud Policy Modified or Deleted
id: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
description: Detects when policies are modified or deleted in JumpCloud
author: RunReveal
date: 2025-05-26
references:
    - https://docs.jumpcloud.com/api/insights/directory/1.0/index.html
tags:
    - attack.defense-evasion
    - attack.persistence
sourcetypes:
    - jumpcloud
categories:
    - jumpcloud
mitreattacks:
    - defense-evasion
detection:
    selection:
        eventName:
            - policy_update
            - policy_delete
            - authpolicy_update
            - authpolicy_delete
    condition: selection
falsepositives:
    - Legitimate policy changes by authorized administrators
level: low
riskscore: 20
