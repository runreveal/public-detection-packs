title: JumpCloud User/Admin Account Locked Out
id: 4c5d6e7f-8a9b-0c1d-2e3f-4a5b6c7d8e9f
description: Detects when a user or admin account is locked out in JumpCloud
author: RunReveal
date: 2025-05-26
references:
  - https://docs.jumpcloud.com/api/insights/directory/1.0/index.html
tags:
  - attack.credential-access
  - attack.impact
  - attack.t1110
  - jumpcloud
  - identity-access-management
  - authentication
  - signal
  - account-lockout
sourcetypes:
  - jumpcloud
mitreAttacks:
  - TA0006
  - TA0040
mitreTechniques:
  - T1110
detection:
  selection1:
    normalized.eventName:
      - user_lockout
      - user_suspended
  selection2:
    admin_login_attempt: failure
  condition: selection1 or selection2
falsepositives:
  - Legitimate account lockouts due to forgotten passwords
level: medium
riskscore: 30
