title: JumpCloud Password Manager Activity
id: 4a5b6c7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d
description: Detects password manager activity in JumpCloud including invites and deactivations
author: RunReveal
date: 2025-05-26
references:
    - https://docs.jumpcloud.com/api/insights/directory/1.0/index.html
tags:
    - attack.credential-access
    - attack.collection
sourcetypes:
    - jumpcloud
categories:
    - jumpcloud
    - jumpcloud
    - identity-access-management
    - entity-management
    - signal
    - password-manager
mitreattacks:
    - credential-access
mitretechniques:
    - T1555
detection:
    selection:
        normalized.eventName:
            - password_manager_invite
            - password_manager_activation
            - password_manager_deactivation
            - password_manager_folder_create
    condition: selection
falsepositives:
    - Legitimate password manager usage by authorized users
level: low
riskscore: 5
