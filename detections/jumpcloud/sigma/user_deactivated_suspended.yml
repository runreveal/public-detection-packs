title: JumpCloud User Account Deactivated or Suspended
id: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
description: Detects when a user account is deactivated or suspended in JumpCloud
author: RunReveal
date: 2025-05-26
references:
    - https://docs.jumpcloud.com/api/insights/directory/1.0/index.html
tags:
    - attack.impact
    - attack.t1531 # Account Access Removal
sourcetypes:
    - jumpcloud
categories:
    - jumpcloud
mitreattacks:
    - impact
detection:
