title: Kubernetes Secret Accessed
id: kubernetes-secret-accessed
description: >
  Detects get or list operations on Kubernetes secrets. Secrets store
  sensitive data such as passwords, tokens, and certificates. Unauthorized
  access may indicate credential theft or reconnaissance.
references:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://kubernetes.io/docs/reference/access-authn-authz/audit-policy/
author: RunReveal
date: 2025-07-24
tags:
  - kubernetes
  - identity-access-management
  - signal
sourcetypes:
  - kubernetes-audit
detection:
  selection:
    verb:
      - get
      - list
    objectRef.resource: secrets
  condition: selection
falsepositives:
  - Kubernetes controllers and operators that read secrets for normal operations
  - Application pods mounting secrets via service account permissions
level: medium
riskscore: 55
mitreAttacks:
  - TA0006
mitreTechniques:
  - T1552.007
