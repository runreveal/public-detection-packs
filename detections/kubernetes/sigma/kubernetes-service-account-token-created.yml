title: Kubernetes Service Account Token Created
id: kubernetes-service-account-token-created
description: >
  Detects token request operations for service accounts. Service account
  tokens grant API access and their creation outside normal workflows
  may indicate credential harvesting for persistence or lateral movement.
references:
  - https://kubernetes.io/docs/reference/kubernetes-api/authentication-resources/token-request-v1/
  - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
author: RunReveal
date: 2025-07-24
tags:
  - kubernetes
  - identity-access-management
  - signal
sourcetypes:
  - kubernetes-audit
detection:
  selection:
    verb: create
    objectRef.resource: serviceaccounts
    objectRef.subresource: token
  condition: selection
falsepositives:
  - Kubernetes control plane generating tokens for pod service accounts
  - CI/CD systems requesting tokens for deployment automation
level: medium
riskscore: 60
mitreAttacks:
  - TA0006
mitreTechniques:
  - T1078
