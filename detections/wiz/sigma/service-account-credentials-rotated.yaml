title: Wiz Service Account Credentials Rotated
id: wiz-service-account-credentials-rotated
description: Tracks service account credential rotations which may indicate security maintenance or potential compromise response
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1098/
tags:
  - attack.persistence
  - attack.t1098
  - wiz
  - identity-access-management
  - signal
  - service-account
sourcetypes:
  - wiz-threats
  - wiz-issue
mitreattacks:
  - TA0003
mitretechniques:
  - T1098
detection:
  selection:
    controlName|contains:
      - 'Service Account'
      - 'API Key'
      - 'Access Key'
      - 'Secret'
    triggerType:
      - 'ROTATED'
      - 'UPDATED'
      - 'CREATED'
  condition: selection
falsepositives:
  - Scheduled credential rotation policies
  - Security best practices implementation
level: medium
riskscore: 50
