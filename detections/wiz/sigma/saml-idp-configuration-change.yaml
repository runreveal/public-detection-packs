title: Wiz SAML Identity Provider Configuration Change
id: wiz-saml-idp-configuration-change
description: Detects SAML identity provider modifications that could enable unauthorized access or authentication bypass
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1556/
tags:
  - attack.persistence
  - attack.defense-evasion
  - attack.t1556
  - wiz
  - identity-access-management
  - signal
  - saml
sourcetypes:
  - wiz-threats
  - wiz-issue
mitreattacks:
  - TA0003
  - TA0005
mitretechniques:
  - T1556
detection:
  selection:
    controlName|contains:
      - 'SAML'
      - 'Identity Provider'
      - 'SSO'
      - 'Single Sign-On'
    triggerType:
      - 'UPDATED'
      - 'CREATED'
      - 'DELETED'
  condition: selection
falsepositives:
  - Authorized identity provider updates
  - Routine SSO configuration changes
level: high
riskscore: 75
