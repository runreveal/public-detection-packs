title: Wiz User Role Privilege Escalation
id: wiz-user-role-privilege-escalation
description: Tracks access control privilege changes that may indicate unauthorized privilege escalation
author: RunReveal
date: 2025/01/22
references:
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1078
  - wiz
  - identity-access-management
  - signal
  - rbac
sourcetypes:
  - wiz-threats
  - wiz-issue
mitreattacks:
  - TA0004
  - TA0003
mitretechniques:
  - T1078
detection:
  selection:
    controlName|contains:
      - 'Role'
      - 'Permission'
      - 'Access Control'
      - 'Privilege'
      - 'Admin'
    triggerType:
      - 'UPDATED'
      - 'CREATED'
    controlSeverity:
      - 'CRITICAL'
      - 'HIGH'
