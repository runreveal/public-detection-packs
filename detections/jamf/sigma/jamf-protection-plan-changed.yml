title: JAMF Protect Endpoint Protection Plan Changed
id: jamf-protect-endpoint-protection-plan-changed
description: >
  Detects modifications to JAMF Protect endpoint protection plans. Changes to
  protection plans could weaken endpoint security posture if made by an
  unauthorized user or compromised admin account.
references:
  - https://learn.jamf.com/en-US/bundle/jamf-protect-documentation/page/Plans.html
  - https://attack.mitre.org/techniques/T1562/
author: RunReveal
date: 2025-07-24
tags:
  - jamf
  - audit-activity
  - signal
sourcetypes:
  - jamf-protect
detection:
  selection:
    eventName:
      - PlanUpdated
      - PlanDeleted
      - PlanCreated
      - protection_plan_modified
  condition: selection
falsepositives:
  - Planned protection plan updates by security administrators
  - Rollout of new protection configurations during policy reviews
level: medium
riskscore: 60
mitreAttacks:
  - TA0005
mitreTechniques:
  - T1562
