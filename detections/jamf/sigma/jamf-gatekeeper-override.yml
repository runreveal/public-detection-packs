title: JAMF Protect Gatekeeper Override
id: jamf-protect-gatekeeper-override
description: >
  Detects when a user bypasses macOS Gatekeeper to run an unsigned or
  unnotarized application. Gatekeeper overrides can be used to execute
  malicious applications that would otherwise be blocked by macOS security.
references:
  - https://support.apple.com/guide/security/gatekeeper-and-runtime-protection-sec5599b66df
  - https://attack.mitre.org/techniques/T1553/001/
author: RunReveal
date: 2025-07-24
tags:
  - jamf
  - system-activity
  - signal
sourcetypes:
  - jamf-protect
detection:
  selection:
    eventName:
      - GPGatekeeperOverride
      - gatekeeper_override
      - com.apple.syspolicy.exec
  condition: selection
falsepositives:
  - Developers running locally built unsigned applications
  - IT-approved applications pending notarization
level: high
riskscore: 70
mitreAttacks:
  - TA0005
mitreTechniques:
  - T1553.001
