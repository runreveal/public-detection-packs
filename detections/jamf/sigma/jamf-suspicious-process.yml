title: JAMF Protect Suspicious Process Execution
id: jamf-protect-suspicious-process-execution
description: >
  Detects process execution events captured by JAMF Protect on managed macOS
  endpoints. These events are evaluated against JAMF's analytic detection rules
  and may indicate command-and-control activity, post-exploitation tooling,
  or lateral movement attempts.
references:
  - https://learn.jamf.com/en-US/bundle/jamf-protect-documentation/page/Threat_Events_Stream_Event_Types.html
  - https://learn.jamf.com/en-US/bundle/jamf-protect-documentation/page/Analytic_Detections.html
author: RunReveal
date: 2025-07-24
tags:
  - jamf
  - system-activity
  - signal
sourcetypes:
  - jamf-protect
detection:
  selection:
    eventName: GPProcessEvent
  condition: selection
falsepositives:
  - Legitimate administrative scripts or automation tools
  - Developer tooling that mimics suspicious behavior patterns
level: medium
riskscore: 60
mitreAttacks:
  - TA0002
mitreTechniques:
  - T1059
