disabled: true

name: 1password-multiple-admin-actions
displayName: 1Password Multiple Administrative Actions
file: multiple_admin_actions.sql
description: Detects multiple administrative actions performed rapidly by a single user that could indicate automated attacks or compromise
categories:
  - runreveal-detection
  - 1password
  - signal
severity: Medium
riskScore: 65
mitreAttacks:
  - persistence
  - t1098
sourceTypes:
