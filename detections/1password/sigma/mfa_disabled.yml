title: 1Password MFA Disabled
id: a1b2c3d4-e5f6-7890-1234-567890abcdef
description: Detects when multi-factor authentication is disabled for a 1Password user account
author: RunReveal
date: 2025-01-06
references:
    - https://developer.1password.com/docs/events-api/audit-events/
tags:
    - attack.credential-access
    - attack.t1556
sourcetypes:
    - 1password
categories:
    - 1password
mitreattacks:
    - credential-access
detection:
    selection:
        normalized.eventName:
            - enblmfa
            - disblmfa
            - authentication_factor_removed
    condition: selection
falsepositives:
    - Legitimate MFA configuration changes by administrators
level: high
riskscore: 85