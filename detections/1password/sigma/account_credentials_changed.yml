title: 1Password Account Credentials Changed
id: 1a2b3c4d-5e6f-7890-1234-567890abcdef
description: Detects when a 1Password account password or Secret Key is changed, which could indicate account compromise
author: RunReveal
date: 2025-01-06
references:
    - https://developer.1password.com/docs/events-api/audit-events/
tags:
    - attack.credential-access
    - attack.t1556
sourcetypes:
    - 1password
categories:
    - 1password
mitreattacks:
    - credential-access
detection:
    selection:
        normalized.eventName:
            - changemp  # Change 1Password account password
            - changesk  # Change Secret Key
    condition: selection
falsepositives:
    - Legitimate password changes by users
    - Scheduled password rotations
level: medium
riskscore: 60