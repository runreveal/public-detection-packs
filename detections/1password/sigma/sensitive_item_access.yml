title: 1Password Item Access
id: a0b1c2d3-e4f5-6789-0123-456789abcdef
description: Detects patterns of item access that could indicate credential harvesting or data exfiltration
author: RunReveal
date: 2025-01-06
references:
    - https://developer.1password.com/docs/events-api/audit-events/
tags:
    - attack.collection
    - attack.t1005
    - attack.credential-access
    - attack.t1555
sourcetypes:
    - 1password
categories:
    - 1password
mitreattacks:
    - collection
    - credential-access
detection:
    selection:
        normalized.eventName:
            - view       # View item
            - update     # Update item (could indicate modification)
        normalized.object_type: item
    condition: selection
falsepositives:
    - Legitimate password updates or reviews
    - Administrative auditing activities
    - Password manager migration or synchronization
    - Normal user workflow with many credential lookups
level: low
riskscore: 30