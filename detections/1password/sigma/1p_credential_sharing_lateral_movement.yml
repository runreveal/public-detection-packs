title: 1Password Credential Sharing for Lateral Movement
id: 4d5e6f7a-8b9c-0123-def4-234567890123
description: |
  Detects credential sharing activities that could facilitate lateral movement,
  including external sharing and rapid succession of reveal followed by share events.
references:
  - https://developer.1password.com/docs/events-api/audit-events/
  - https://attack.mitre.org/techniques/T1078/
author: RunReveal
date: 2025-12-09
tags:
  - 1password
  - identity-access-management
  - lateral-movement
  - signal
  - credential-sharing
sourcetypes:
  - 1password
detection:
  selection:
    eventName: share
    logType: auditevents
  condition: selection
falsepositives:
  - Legitimate credential sharing with team members
  - Normal collaboration workflows
  - Authorized partner access
level: medium
riskscore: 50
mitreattacks:
  - lateral-movement
mitretechniques:
  - T1078
