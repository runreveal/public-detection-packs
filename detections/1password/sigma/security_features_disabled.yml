title: 1Password Security Features Disabled
id: 3c4d5e6f-7g8h-9012-3456-789012cdefgh
description: Detects when critical security features like MFA, Duo, or SSO are disabled
author: RunReveal
date: 2025-01-06
references:
    - https://developer.1password.com/docs/events-api/audit-events/
tags:
    - attack.defense-evasion
    - attack.t1562
sourcetypes:
    - 1password
categories:
    - 1password
    - identity-access-management
    - authentication
    - signal
    - security-controls
mitreattacks:
    - defense-evasion
detection:
    selection:
        normalized.eventName:
            - disblmfa   # Disable multi-factor authentication
            - disblduo   # Disable Duo
            - disblsso   # Disable SSO
    condition: selection
falsepositives:
    - Legitimate configuration changes during maintenance
    - Policy updates by administrators
level: high
riskscore: 90