title: 1Password Suspicious Authentication Activities
id: 7g8h9i0j-1k2l-3456-7890-123456ghijkl
description: Detects potentially suspicious authentication-related activities
author: RunReveal
date: 2025-01-06
references:
    - https://developer.1password.com/docs/events-api/audit-events/
tags:
    - attack.credential-access
    - attack.t1078
sourcetypes:
    - 1password
categories:
    - 1password
    - identity-access-management
    - authentication
    - signal
    - suspicious-activity
mitreattacks:
    - credential-access
detection:
    selection:
        normalized.eventName:
            - reauth     # Reauthorize device
            - ssotkn     # Create sign-in token
            - ssotknv    # Sign in with sign-in token
            - beginr     # Begin recovery
            - completr   # Complete recovery
    condition: selection
falsepositives:
    - Legitimate device reauthorization
    - Normal SSO token usage
    - Authorized account recovery
level: medium
riskscore: 40