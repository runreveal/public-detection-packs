title: Tor Network Traffic
description:
  Detect threats from Tor network traffic using RunReveal managed enrichment
  data.
categories:
  - emerging-threats
  - network-activity
  - network-activity
  - signal
  - threat-intelligence
  - tor-network
sourcetypes:
  - alb
  - cf-gateway-dns
  - cf-gateway-http
  - flow
  - nsg-flow
detection:
  selection1:
    enrichments.ip_threat_intel.tor-node: true
  selection2:
    enrichments.ip_threat_intel.tor-exit: true
  condition: selection1 or selection2
level: high
fields:
  - action
  - elbStatusCode
  - result
riskscore: 80
mitreattacks:
  - defense-evasion
  - command-and-control
mitretechniques:
  - T1090
