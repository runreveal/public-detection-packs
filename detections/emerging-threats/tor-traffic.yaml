title: Tor Network Traffic
description: Detect threats from Tor network traffic using RunReveal managed enrichment data.
categories:
  - emerging-threats
  - network-activity
  - network-activity
  - signal
  - threat-intelligence
  - tor-network
sourcetypes:
  - alb
  - cf-gateway-dns
  - cf-gateway-http
  - flow
  - nsg-flow
detection:
  selection1:
    enrichments.ip_threat_intel.tor-node: true
  selection2:
    enrichments.ip_threat_intel.tor-exit: true
  condition: selection1 or selection2
level: high
fields:
  - action # nsg/flow logs
  - elbStatusCode # elb logs
  - result # cf-audit logs
riskscore: 80
mitreattacks:
  - command-and-control
  - defense-evasion
mitretechniques:
  - T1090
