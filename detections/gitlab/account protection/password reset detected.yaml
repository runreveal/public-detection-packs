title: Password reset detected
id: db36527d-f1a1-431c-8206-990004ea24fb
status: experimental
description: Detects account takeover attempts
references:
    - https://docs.gitlab.com/ee/security/reset_user_password.html
author: Harjeet Sharma
date: 2024/06/26
tags:
    - attack.credential_access
    - gitlab.saas
logsource:
    category: application
    product: gitlab
    service: audit_json.log
detection:
    selection:
        custom_message: "Ask for password reset"
    condition: selection

falsepositives:
    - This alert may be noisy and should be used in conjunction with other alerts
level: low
