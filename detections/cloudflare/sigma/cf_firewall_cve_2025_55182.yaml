title: Cloudflare Firewall CVE-2025-55182 React Server RCE Detection
id: cf-firewall-cve-2025-55182
description: Detects exploitation attempts of CVE-2025-55182, a critical pre-authentication remote code execution vulnerability in React Server Components (versions 19.0.0, 19.1.0, 19.1.1, and 19.2.0). The vulnerability stems from unsafe deserialization of payloads to Server Function endpoints allowing unauthenticated remote code execution.
