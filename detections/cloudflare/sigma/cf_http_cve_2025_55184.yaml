title: Cloudflare HTTP CVE-2025-55184 React Function DoS Detection
id: cf-http-cve-2025-55184
description: Detects exploitation attempts of CVE-2025-55184, a denial-of-service vulnerability affecting React-based applications. This vulnerability enables resource-exhaustion attacks that impact application availability through malicious React function invocations. This detection analyzes HTTP logs for traffic matching specific Cloudflare security rules.
references:
  - https://nvd.nist.gov/vuln/detail/CVE-2025-55184
  - https://developers.cloudflare.com/changelog/2025-12-11-emergency-waf-release/
  - https://developers.cloudflare.com/logs/reference/log-fields/zone/http_requests/
author: RunReveal
date: 2025-12-12
modified: 2025-12-12
tags:
  - attack.impact
  - attack.t1499
  - cloudflare
  - cf-http
  - network-activity
  - signal
  - findings
  - cve-2025-55184
  - react
  - dos
sourcetypes:
  - cf-http
riskscore: 75
mitreattacks:
  - impact
mitretechniques:
  - T1499
detection:
  selection:
    rawLog.SecurityRuleIDs:
      - "2694f1610c0b471393b21aef102ec699"
  condition: selection
falsepositives:
  - Legitimate traffic matching firewall rules
  - Security scanning and testing activities
  - Traffic blocked by the firewall
  - False positives in firewall rule matching
level: high
fields:
  - SecurityRuleIDs
  - SecurityRuleID
  - SecurityRuleDescription
  - SecurityActions
  - SecurityAction
  - ClientIP
  - ClientCountry
  - ClientRequestHost
  - ClientRequestURI
  - ClientRequestMethod
  - ClientRequestUserAgent
  - EdgeResponseStatus
  - OriginResponseStatus
  - BotScore
  - BotScoreSrc
