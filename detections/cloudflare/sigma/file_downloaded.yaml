disabled: true
title: File Downloaded
status: stable
description: A file was downloaded through Cloudflare gateway.
references:
  - https://developers.cloudflare.com/cloudflare-one/insights/logs/gateway-logs/
author: RunReveal
date: 2025-01-13
modified: 2025-01-13
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1005
  - attack.t1041
  - cloudflare
  - gateway
  - network-activity
  - http-activity
  - signal
  - file-activity
  - data-exposure
  - cf-gateway-http
sourcetypes:
  - cf-gateway-http
riskscore: 30
mitreAttacks:
  - TA0009
  - TA0010
mitreTechniques:
  - T1005
  - T1041
detection:
  selection_action:
    rawLog.Action: "allow"
  filter_empty:
    rawLog.DownloadedFileNames.#: 0
  filter_unknown_only:
    rawLog.DownloadedFileNames.#: 1
    rawLog.DownloadedFileNames.0: "<unknown file name>"
  condition: selection_action and not filter_empty and not filter_unknown_only
falsepositives:
  - Legitimate file downloads by users
  - Automated system updates
  - Business-critical file transfers
level: low
fields:
  - DownloadedFileNames
  - URL
  - HTTPHost
  - Email
  - DeviceName
  - SourceIP
  - PolicyName
  - UserAgent
  - HTTPMethod
  - HTTPStatusCode
  - FileInfo.files
