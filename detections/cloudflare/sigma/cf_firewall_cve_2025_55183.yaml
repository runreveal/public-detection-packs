title: Cloudflare Firewall CVE-2025-55183 React Server Function Leaking Detection
id: cf-firewall-cve-2025-55183
description: Detects exploitation attempts of CVE-2025-55183, a critical vulnerability that allows server-function abuse techniques to expose internal logic in React Server Components. This vulnerability enables attackers to leak server function source code and internal application logic through specially crafted requests.
