name: excessive-non-get-requests
displayName: Cloudflare API Abuse (Non-GET requests from single IP)
description: Detects when a single IP address makes an excessive number of non-GET HTTP requests, which may indicate API abuse, automated attacks, or scanning activity.
file: cf_excessive_non_get_requests.sql
categories:
  - cloudflare
  - waf
  - network-activity
  - http-activity
  - signal
  - api-abuse
  - cf-http
  - cf-waf
schedule: "*/5 * * * *"
parameters:
  window: "1"
  threshold: "500"
  excluded_method: "GET"
riskScore: 65
severity: Medium
sourceTypes:
  - cf-http
mitreAttacks:
  - discovery
  - impact
mitreTechniques:
  - T1046
  - T1499
