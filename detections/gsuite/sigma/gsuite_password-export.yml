title: GSuite Password Export Attempt
description: |
  Detects attempts to export saved passwords from Chrome sync or admin console which
  could indicate credential harvesting.
references:
  - https://support.google.com/chrome/answer/95606
  - https://attack.mitre.org/techniques/T1555/
author: RunReveal
date: 2025-12-09
tags:
  - gsuite
  - identity-access-management
  - credential-access
  - signal
sourcetypes:
  - gsuite
detection:
  selection:
    eventName:
      - CHANGE_PASSWORD
      - GENERATE_2SV_SCRATCH_CODES
  condition: selection
falsepositives:
  - Legitimate password management by IT administrators
  - Users resetting their own passwords
  - Authorized password rotation policies
level: medium
riskscore: 50
mitreattacks:
  - credential-access
mitretechniques:
  - T1555
