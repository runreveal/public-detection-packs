  unauthorized API calls or data access.
references:
  - https://developers.google.com/apps-script
  - https://attack.mitre.org/techniques/T1059/009/
author: RunReveal
date: 2025-12-09
tags:
  - gsuite
  - application-activity
  - execution
  - signal
sourcetypes:
  - gsuite
detection:
  selection:
    eventName: authorize
    id.applicationName: token
  condition: selection
falsepositives:
