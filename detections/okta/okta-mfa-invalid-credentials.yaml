# Remove disabled property to start using the detection
disabled: true

name: okta-mfa-invalid-credentials
displayName: Okta MFA Authentication Failed - Invalid Credentials
description: Detects failed MFA authentication attempts due to invalid credentials in Okta. This event indicates potential credential stuffing attacks, brute force attempts, or users with compromised passwords trying to authenticate. Failed MFA attempts with invalid credentials can signal ongoing attacks against user accounts and should be monitored for patterns indicating coordinated attacks or account compromise attempts.
file: okta-mfa-invalid-credentials.sql
categories:
  - runreveal-detection
  - okta
  - signal
  - mfa
  - authentication-failure
  - invalid-credentials
  - brute-force
  - credential-stuffing
  - account-compromise
mitreAttacks:
  - credential-access
  - initial-access
  - discovery
  - impact
severity: Medium
riskScore: 60
schedule: '*/15 * * * *'
parameters:
  window: '30'
notes: 'This detection identifies failed MFA attempts with invalid credentials. The original rule includes filters for specific MFA factors and ASN organizations that should be customized for your environment. High frequency failures from the same IP or targeting the same user may indicate attacks.'
sourceTypes:
  - okta 