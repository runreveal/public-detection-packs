name: okta-admin-app-access
displayName: Okta Admin App Access
description:
  Detects when a user successfully accesses the Okta admin application.
  This event indicates administrative access to Okta's management interface, which
  should be monitored for unauthorized access or privilege escalation attempts. Regular
  monitoring of admin app access helps ensure only authorized personnel are accessing
  administrative functions.
