name: okta-show-password-other-user
displayName: Okta Show Password for Other User
description:
  Detects when an administrator or user views the password for another
  user's application membership. This event indicates potential unauthorized access
  to user credentials, privilege abuse, or administrative oversight activities. Password
  disclosure events where the actor is not the password owner should be carefully
  reviewed as they represent access to sensitive credential information that could
  be misused.
file: okta-show-password-other-user.sql
categories:
  - okta
  - admin
  - identity-access-management
  - entity-management
  - signal
  - password-disclosure
  - credential-access
  - privilege-abuse
  - admin-activity
mitreAttacks:
  - initial-access
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
mitreTechniques:
  - T1555
  - T1078.004
severity: High
riskScore: 85
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies when someone views a password for another user's
  application membership. These events should be investigated to ensure they are authorized
  administrative activities and not credential theft attempts.
sourceTypes:
  - okta
