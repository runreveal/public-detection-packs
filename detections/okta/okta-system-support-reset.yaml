  - TA0004
mitreTechniques:
  - T1098
  - T1556.006
severity: Medium
riskScore: 75
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies automated support operations performed by system@okta.com
  with unknown transaction IDs and no user agent or geographic context. These should
  be correlated with approved support tickets and verified as legitimate backend operations.
