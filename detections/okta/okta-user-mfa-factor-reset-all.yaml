mitreTechniques:
  - T1556.006
  - T1098
severity: Critical
riskScore: 90
schedule: "*/5 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies complete MFA factor resets which remove all authentication
  protections for users. These events should be immediately investigated and correlated
  with approved administrative procedures or legitimate user support requests.
