name: okta-admin-privilege-grant
displayName: Okta Admin Privilege Grant
description:
  Detects when administrator privileges are successfully granted to a user
  in Okta. This event indicates privilege escalation and should be closely monitored
  as it grants significant administrative access to Okta resources. Admin privilege
  grants can be legitimate but should be verified to ensure they are authorized and
  follow proper approval processes.
