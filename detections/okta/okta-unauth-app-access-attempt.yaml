# Remove disabled property to start using the detection
disabled: true

name: okta-unauth-app-access-attempt
displayName: Okta Unauthorized App Access Attempt
description: Detects when a user attempts unauthorized access to an application in Okta. This event indicates potential security violations where users are trying to access applications they don't have permission to use. These attempts could indicate compromised accounts, privilege escalation attempts, or users testing system boundaries.
file: okta-unauth-app-access-attempt.sql
categories:
  - runreveal-detection
  - okta
  - signal
  - unauthorized-access
  - security-violation
mitreAttacks:
  - initial-access
  - privilege-escalation
  - discovery
severity: High
riskScore: 80
schedule: '*/15 * * * *'
parameters:
  window: '30'
sourceTypes:
  - okta 