name: okta-oauth2-token-reuse
displayName: Okta OAuth2 Token Reuse Detection
description:
  Detects when Okta identifies OAuth2 token reuse, which indicates potential
  token theft, replay attacks, or credential compromise. Token reuse detection is
  a critical security feature that identifies when the same OAuth2 token is being
  used from multiple sources or in suspicious patterns. These events represent high-confidence
  indicators of security incidents involving stolen or compromised authentication
  tokens.
file: okta-oauth2-token-reuse.sql
categories:
  - attack.defense-evasion
  - attack.credential-access
  - attack.lateral-movement
  - attack.t1528
  - attack.t1550.001
  - okta
  - auth
  - identity-access-management
  - authentication
  - signal
  - oauth2
  - token-reuse
  - credential-theft
  - replay-attack
  - token-compromise
mitreAttacks:
  - TA0005
  - TA0006
  - TA0008
mitreTechniques:
  - T1528
  - T1550.001
severity: High
riskScore: 90
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies OAuth2 token reuse events which are high-confidence
  indicators of token theft or compromise. These events should trigger immediate investigation
  and potential token revocation.
sourceTypes:
  - okta
