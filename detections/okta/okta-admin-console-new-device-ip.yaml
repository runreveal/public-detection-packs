  - defense-evasion
  - credential-access
mitreTechniques:
  - T1078.004
severity: High
riskScore: 85
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies admin console access from both new devices and new
  IPs simultaneously. It checks both the behaviors field and logOnlySecurityData for
  risk indicators. These events warrant immediate investigation due to the administrative
  privileges involved.
