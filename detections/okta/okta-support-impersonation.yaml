name: okta-support-impersonation
displayName: Okta Support User Session Impersonation
description: Detects when Okta support staff grant or initiate user session impersonation for troubleshooting purposes. These events indicate that Okta support personnel are accessing user accounts to provide technical assistance or resolve issues. While typically legitimate, these events should be monitored to ensure they align with approved support tickets and follow proper authorization procedures for accessing user accounts.
file: okta-support-impersonation.sql
categories:
  - okta
  - admin
  - identity-access-management
  - entity-management
  - signal
  - impersonation
  - support-access
  - privileged-access
  - session-management
mitreAttacks:
  - privilege-escalation
  - lateral-movement
  - persistence
  - defense-evasion
mitreTechniques:
  - T1078.004
  - T1550.001
severity: Medium
riskScore: 70
schedule: '*/15 * * * *'
parameters:
  window: '30'
notes: 'This detection monitors Okta support impersonation events. These should be correlated with approved support tickets and verified as legitimate troubleshooting activities. Unexpected impersonation events should be investigated immediately.'
fields:
  - actor.alternateID
  - actor.displayName
  - actor.type
  - eventType
  - outcome
  - displayMessage
  - target
  - client.userAgent
  - client.zone
sourceTypes:
  - okta 