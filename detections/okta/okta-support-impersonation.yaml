disabled: true
name: okta-support-impersonation
displayName: Okta Support User Session Impersonation
description:
  Detects when Okta support staff grant or initiate user session impersonation
  for troubleshooting purposes. These events indicate that Okta support personnel
  are accessing user accounts to provide technical assistance or resolve issues. While
  typically legitimate, these events should be monitored to ensure they align with
  approved support tickets and follow proper authorization procedures for accessing
  user accounts.
