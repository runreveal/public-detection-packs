name: okta-multiple-devices-added-from-one-location
displayName: Okta Multiple Devices Added From One Location
type: sql
description:
  This detection shows multiple users added a new device from the same
  IP address with a whitelist to exclude an office IP address space, indicating likelyhood
  that multiple users could have been compromised by one threat actor.
