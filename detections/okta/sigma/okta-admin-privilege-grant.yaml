disabled: true
title: Okta Admin Privilege Grant
status: test
description: |
  Detects when administrator privileges are successfully granted to a user account
  in Okta. This could indicate legitimate role assignment or an attacker escalating
  privileges within the identity provider.
author: RunReveal
logsource:
  product: okta
sourcetypes:
  - okta
tags:
  - tier-one
  - attack.privilege-escalation
  - okta
  - identity-access-management
  - signal
  - iam
  - admin
mitreAttacks:
  - TA0004
detection:
  selection:
    eventType: "user.account.privilege.grant"
    outcome.result: "SUCCESS"
    debugContext|contains: "administrator"
  condition: selection
fields:
  - eventType
  - outcome.result
  - actor.alternateId
  - actor.displayName
  - debugContext
  - srcIP
level: high
riskscore: 80
