autoTriage: true
title: Okta API Key Created
status: test
description: |
  Detects when a new API token is created in Okta. API tokens provide programmatic
  access to the Okta API and could be used by an attacker to establish persistence
  or exfiltrate data.
author: RunReveal
logsource:
  product: okta
sourcetypes:
  - okta
tags:
  - tier-one
  - attack.credential-access
  - attack.persistence
  - okta
  - identity-access-management
  - signal
  - credential-management
  - api-security
mitreAttacks:
  - TA0006
  - TA0003
detection:
  selection:
    eventName: "system.api_token.create"
  condition: selection
fields:
  - eventName
  - actor.alternateId
  - actor.displayName
  - srcIP
level: high
riskscore: 80
