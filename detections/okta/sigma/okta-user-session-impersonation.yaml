disabled: true
title: Okta User Session Impersonation
status: test
description: |
  Detects user session impersonation events in Okta, including granting impersonation
  rights and initiating impersonation sessions. These events may indicate legitimate
  administrative support activity or unauthorized access through session hijacking.
author: RunReveal
logsource:
    product: okta
sourcetypes:
    - okta
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - okta
    - identity-access-management
    - signal
    - authentication
    - impersonation
mitreAttacks:
    - TA0004
    - TA0005
detection:
    selection:
        eventType:
            - 'user.session.impersonation.grant'
            - 'user.session.impersonation.initiate'
    condition: selection
fields:
    - eventType
    - actor.alternateId
    - actor.displayName
    - srcIP
    - outcome.result
level: high
riskscore: 80