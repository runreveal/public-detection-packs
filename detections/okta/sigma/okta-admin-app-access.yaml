disabled: true
title: Okta Admin App Access
status: test
description: |
  Detects when a user successfully accesses the Okta admin application. This may
  indicate legitimate administrative activity or unauthorized access to privileged
  management interfaces.
author: RunReveal
logsource:
    product: okta
sourcetypes:
    - okta
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1078.004
    - okta
    - identity-access-management
    - signal
    - admin-access
    - authentication
mitreAttacks:
    - TA0001
    - TA0003
    - TA0004
    - TA0005
mitreTechniques:
    - T1078.004
detection:
    selection:
        eventType: 'user.session.access_admin_app'
        outcome.result: 'SUCCESS'
    condition: selection
fields:
    - eventType
    - outcome.result
    - actor.alternateId
    - actor.displayName
    - srcIP
    - client.userAgent
level: medium
riskscore: 50