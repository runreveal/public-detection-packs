title: Okta Account Lockout Followed by Reset Attempt
id: 8e9f2g6h-7i5j-8k0l-1m2n-3o4p5q6r7s8t
status: experimental
description: Detects account lockouts followed by password reset attempts, indicating potential account takeover progression
author: RunReveal
date: 2025/05/23
references:
    - https://developer.okta.com/docs/reference/api/event-types/
tags:
    - attack.credential_access
    - attack.t1110      # Brute Force
    - attack.t1078      # Valid Accounts
sourcetypes:
    - okta
detection:
    account_locked:
        eventType: "user.account.lock"
    password_reset:
        eventType: 
            - "user.account.reset_password"
            - "system.email.password_reset.sent_message"
    timeframe: 1h
    condition: account_locked followed by password_reset
fields:
    - eventTime
    - eventType
    - actor.alternateId
    - actor.displayName
    - client.ipAddress
    - client.geographicalContext.country
    - outcome.result
falsepositives:
    - Legitimate users who forgot passwords after lockout
    - Help desk initiated password resets
    - Self-service password resets by legitimate users
level: medium
