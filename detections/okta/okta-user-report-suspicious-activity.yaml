name: okta-user-report-suspicious-activity
displayName: Okta User Report Suspicious Activity by End User
description:
  Detects when end users report suspicious activity on their own accounts
  in Okta. This is a valuable security signal as users are often the first to notice
  unauthorized access attempts or unusual activity on their accounts. These reports
  can indicate ongoing attacks, compromised credentials, or social engineering attempts.
  While some reports may be false positives due to user confusion, they should all
  be investigated as they represent user-initiated security concerns.
