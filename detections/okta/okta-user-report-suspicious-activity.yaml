  - T1087
severity: High
riskScore: 85
schedule: "*/5 * * * *"
parameters:
  window: "30"
notes:
  This detection captures user-reported suspicious activity which is a critical
  security signal. Users reporting suspicious activity on their own accounts should
  trigger immediate investigation as they may indicate active attacks or compromised
  accounts.
