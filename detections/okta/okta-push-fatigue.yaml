name: okta-push-fatigue
displayName: Okta Push Fatigue
type: sql
description: >-
  This detection notifies when a series of failed Okta Push MFA requests are
  followed by a Successful one, indicating possible MFA push fatigue attack
  against a given user in a 10 minute window.
