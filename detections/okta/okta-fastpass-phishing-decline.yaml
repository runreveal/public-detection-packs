# Remove disabled property to start using the detection
disabled: true

name: okta-fastpass-phishing-decline
displayName: Okta FastPass Declined Phishing Attempt
description: Detects when Okta's FastPass feature declines an MFA authentication attempt due to a detected phishing attack. This is a critical security event indicating that FastPass has identified and blocked a potential phishing attempt targeting the user. These events represent active phishing campaigns and should trigger immediate investigation and user notification to prevent successful attacks.
file: okta-fastpass-phishing-decline.sql
categories:
  - runreveal-detection
  - okta
  - signal
  - phishing
  - fastpass
  - mfa
  - authentication-failure
  - security-protection
  - threat-detection
mitreAttacks:
  - initial-access
  - credential-access
  - defense-evasion
  - collection
severity: Critical
riskScore: 95
schedule: '*/15 * * * *'
parameters:
  window: '30'
notes: 'This detection identifies when FastPass successfully blocks phishing attempts. These are high-confidence indicators of active phishing campaigns targeting your users. Immediate investigation and user awareness training should follow these events.'
sourceTypes:
  - okta 