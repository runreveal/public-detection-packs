name: multiple-devices-added-to-okta
displayName: Multiple Devices Added to Okta
description:
  "This signal shows users who have added more than one device in the time
  frame given by parameter `interval` days.


  It only shows the most recent events, i.e. the events that crossed the threshold
  for number of devices added."
file: multiple-devices-added-to-okta.sql
categories:
  - okta
  - okta
  - identity-access-management
  - entity-management
  - multiple-devices
  - suspicious-activity
schedule: 0 * * * *
notes: ""
parameters:
  deviceThreshold: "3"
  interval: "7"
  table: logs
disabled: false
notificationNames: []
mitreAttacks:
  - initial-access
  - persistence
  - privilege-escalation
  - defense-evasion
  - credential-access
mitreTechniques:
  - T1078
  - T1110
severity: medium
riskScore: 0
sourceTypes:
  - okta
