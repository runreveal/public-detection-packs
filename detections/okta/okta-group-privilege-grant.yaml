disabled: true
name: okta-group-privilege-grant
displayName: Okta Group Privilege Grant
description:
  Detects when privileges are granted to a group in Okta. Group privilege
  grants can significantly expand access permissions for multiple users at once and
  should be monitored for unauthorized privilege escalation attempts. This event indicates
  administrative changes to group permissions that could affect security posture and
  access controls.
file: okta-group-privilege-grant.sql
