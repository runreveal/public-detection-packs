  - TA0004
mitreTechniques:
  - T1098.003
severity: High
riskScore: 80
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection monitors for group privilege grants which can affect multiple
  users simultaneously. All group privilege grant events are captured regardless of
  outcome.
