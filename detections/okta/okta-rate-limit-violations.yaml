name: okta-rate-limit-violations
displayName: Okta Rate Limit Violations
description: Detects rate limit violations in Okta including OAuth2 client rate limits, application integration limits, system client limits, operation limits, and organizational concurrency limits. Rate limit violations can indicate automated attacks, API abuse, or misconfigured integrations. This detection excludes known legitimate automated tools (Cloudquery and Permiso) to reduce false positives while identifying potentially malicious or problematic activity.
file: okta-rate-limit-violations.sql
categories:
  - runreveal-detection
  - okta
  - signal
  - rate-limiting
  - api-abuse
  - automation-detection
  - resource-exhaustion
  - dos-protection
mitreAttacks:
  - impact
  - discovery
  - credential-access
  - defense-evasion
severity: Low
riskScore: 15
schedule: '*/15 * * * *'
parameters:
  window: '30'
notes: 'This detection identifies rate limit violations while excluding known legitimate automated tools. High frequency violations from unknown sources should be investigated for potential abuse or attacks.'
sourceTypes:
  - okta 
