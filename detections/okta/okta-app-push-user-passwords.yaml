name: okta-app-push-user-passwords
displayName: Okta Application Pushing User Passwords
description:
  Detects when an application lifecycle update involves pushing user passwords
  to external applications. This event indicates that Okta is synchronizing or provisioning
  user passwords to connected applications, which represents a significant security
  event involving credential transmission. These events should be monitored to ensure
  password synchronization is authorized and follows security policies.
file: okta-app-push-user-passwords.sql
categories:
