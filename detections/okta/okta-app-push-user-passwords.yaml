  - privilege-escalation
  - credential-access
mitreTechniques:
  - T1555
  - T1098
severity: Medium
riskScore: 75
schedule: "*/15 * * * *"
parameters:
  window: "30"
notes:
  This detection identifies when applications are configured to receive user
  passwords from Okta. Password pushing events should be reviewed to ensure they align
  with approved credential management policies and security requirements.
sourceTypes:
