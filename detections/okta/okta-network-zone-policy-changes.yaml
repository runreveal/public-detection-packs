name: okta-network-zone-policy-changes
displayName: Okta Network Zone and Policy Changes
description:
  Detects changes to network zones and security policies in Okta including
  zone deactivations, deletions, updates, policy rule modifications, and security
  zone blacklist removals. These events represent critical security boundary changes
  that can affect access controls, IP restrictions, and authentication policies. Network
  zone changes can bypass geographic restrictions or IP-based security controls, while
  policy changes can weaken authentication requirements.
