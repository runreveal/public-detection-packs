title: Salesforce Critical Setup Changes
id: salesforce-critical-setup-changes
description: >
  Detects changes to critical security configurations such as authentication
  providers, SSO settings, and IP restrictions. Unauthorized modifications could
  weaken the organization's security posture or enable unauthorized access.
references:
  - https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/sforce_api_objects_setupaudittrail.htm
  - https://help.salesforce.com/s/articleView?id=sf.security_overview.htm
author: RunReveal
date: 2025-07-24
tags:
  - salesforce
  - audit-activity
  - signal
sourcetypes:
  - salesforce
detection:
  selection:
    eventName:
      - ChangedAuthProvider
      - ChangedSSOConfig
      - ChangedIPRestriction
      - ChangedLoginPolicy
      - ChangedPasswordPolicy
      - ChangedSessionSettings
  condition: selection
falsepositives:
  - Planned security configuration updates by IT administrators
  - Identity provider migrations or SSO rollout changes
level: medium
riskscore: 60
mitreAttacks:
  - TA0005
mitreTechniques:
  - T1562
