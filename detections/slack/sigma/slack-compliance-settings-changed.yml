title: Slack Compliance Settings Changed
id: slack-compliance-settings-changed
description: >
  Detects changes to DLP, compliance, or data retention configuration
  in Slack. Modifications to compliance settings may indicate an attempt
  to weaken security controls or evade monitoring.
references:
  - https://api.slack.com/admins/audit-logs-call
  - https://slack.com/help/articles/203950296-Use-Slack-Enterprise-Key-Management
author: RunReveal
date: 2025-07-24
tags:
  - slack
  - audit-activity
  - signal
sourcetypes:
  - slack
detection:
  selection:
    eventName:
      - ekm_unenrolled
      - dlp_policy_updated
      - retention_changed
      - compliance_export_started
      - data_retention_updated
  condition: selection
falsepositives:
  - Planned compliance policy updates by security or IT administrators
level: medium
riskscore: 60
mitreAttacks:
  - TA0005
mitreTechniques:
  - T1562
